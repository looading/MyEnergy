name: Apple Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, iphone, watch]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package
        run: ./scripts/package-apple.sh "$PLATFORM" "$RUNNER_TEMP/apple-artifacts"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyEnergy-${{ matrix.platform }}.zip
          path: ${{ runner.temp }}/apple-artifacts/MyEnergy-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7
          archive: false
